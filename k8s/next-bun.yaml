# The Bun binary (the adapter), with the Redis cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-bun
  namespace: next-compiler
spec:
  replicas: 8
  selector:
    matchLabels:
      app: next-bun
  template:
    metadata:
      labels:
        app: next-bun
    spec:
      containers:
        - name: next
          image: next-compiler
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_URI
              value: redis://redis:6379
            # Traces to Jaeger over OTLP/HTTP (see instrumentation.ts).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
            - name: OTEL_SERVICE_NAME
              value: next-bun
          # Half a CPU per replica: 8 replicas take 4 of the node's 10 CPUs,
          # leaving room for k6 and Redis during load tests, so the tests
          # measure the app and not a saturated node.
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/hello
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hello
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: next-bun
  namespace: next-compiler
spec:
  selector:
    app: next-bun
  ports:
    - port: 80
      targetPort: http
      name: http
