# The Bun binary (the adapter), with the Redis cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-bun
  namespace: next-compiler
spec:
  replicas: 8
  selector:
    matchLabels:
      app: next-bun
  template:
    metadata:
      labels:
        app: next-bun
    spec:
      containers:
        - name: next
          image: next-compiler
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_URI
              value: redis://redis:6379
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/hello
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hello
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: next-bun
  namespace: next-compiler
spec:
  selector:
    app: next-bun
  ports:
    - port: 80
      targetPort: http
      name: http
