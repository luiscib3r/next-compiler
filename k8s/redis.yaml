# The shared cache of every replica. A cache, not a database: no persistence,
# and it evicts the least recently used keys when full, as the cache handlers
# expect (entries have no TTL unless Next gave them an `expire`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: next-compiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.2-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: next-compiler
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
      name: redis
