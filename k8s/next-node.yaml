# The classic Next.js standalone server on Node.js, with the Redis cache
# handler (`BUILD_CACHE=redis`), to compare with the binary on equal terms.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-node
  namespace: next-compiler
spec:
  replicas: 8
  selector:
    matchLabels:
      app: next-node
  template:
    metadata:
      labels:
        app: next-node
    spec:
      containers:
        - name: next
          image: next-node-redis
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_URI
              value: redis://redis:6379
            # The standalone server listens on `HOSTNAME`, and Kubernetes sets
            # it to the pod name, so it would listen only on the pod's IP.
            # The binary listens on 0.0.0.0 and reads `HOST` instead.
            - name: HOSTNAME
              value: 0.0.0.0
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/hello
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hello
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: next-node
  namespace: next-compiler
spec:
  selector:
    app: next-node
  ports:
    - port: 80
      targetPort: http
      name: http
