# Tracing backend for the OpenTelemetry work ahead. Jaeger v2 with no
# arguments runs all-in-one with in-memory storage: OTLP on 4317 (gRPC) and
# 4318 (HTTP), the UI on 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: next-compiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          # In-memory storage keeps every span: under load (thousands of
          # requests per second, ~25 spans each) 512Mi ran out in seconds.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: next-compiler
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: ui
      name: ui
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      name: otlp-http
